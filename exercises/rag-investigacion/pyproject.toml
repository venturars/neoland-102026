[project]
name = "rag-neoland"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "chromadb>=1.5.9",
    "cohere>=7.3.0",
    "datasets>=5.1.0",
    "fastembed>=0.9.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.0",
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-openai>=0.8.0",
    "llama-index-llms-openai>=0.9.0",
    "matplotlib>=3.11.2",
    "ollama>=0.6.3",
    "openai>=3.40.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
