[tool.black]
line-length = 79
target-version = ["py310"]
extend-exclude = '''
/(
    \.venv
  | chroma_db
  | python-docs
  | python-docs-md
  | chromadash
)/
'''

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["scripts", "src"]
extend-exclude = [
    ".venv",
    "chroma_db",
    "python-docs",
    "python-docs-md",
    "chromadash",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
norecursedirs = [
    ".venv",
    "chroma_db",
    "python-docs",
    "python-docs-md",
    "chromadash",
]
