<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d2640">
  <title>Tiempo de concentración</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232d2640'/%3E%3Ccircle cx='28' cy='32' r='14' fill='%23f6f0e4'/%3E%3Ccircle cx='36' cy='28' r='11' fill='%232d2640'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      color: #f6f0e4;
      background: radial-gradient(1200px 700px at 50% 0%, #3a3158 0%, #2d2640 42%, #221c36 100%);
    }

    button { font: inherit; }

    :focus { outline: none; }

    :focus-visible {
      outline: 3px solid #f6f0e4;
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .orbs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(46px);
      opacity: 0.42;
      animation: float 16s ease-in-out infinite;
    }

    .orb-a {
      width: 280px;
      height: 280px;
      background: #7c6bb5;
      top: -70px;
      left: -80px;
    }

    .orb-b {
      width: 240px;
      height: 240px;
      background: #e0b15a;
      top: 18%;
      right: -70px;
      animation-delay: -5s;
      opacity: 0.28;
    }

    .orb-c {
      width: 260px;
      height: 260px;
      background: #d9899a;
      bottom: -90px;
      left: 28%;
      animation-delay: -9s;
      opacity: 0.26;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 26rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.6rem 1.35rem 1.35rem;
      background: #342b4e;
      border: 1px solid rgba(246, 240, 228, 0.12);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .count {
      margin: 0;
      padding: 0.32rem 0.8rem;
      border-radius: 999px;
      background: #4a3d6b;
      color: #f0d9a0;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .message {
      margin: 0.9rem 0 0;
      max-width: 20rem;
      color: #cbbde0;
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .mode {
      margin: 0.85rem 0 0;
      font-size: 1rem;
      font-weight: 600;
      color: #f0d9a0;
      transition: color 0.3s ease;
    }

    body[data-mode="short"] .mode { color: #b7e0d4; }
    body[data-mode="long"] .mode { color: #f0c49a; }

    .time {
      margin: 0.35rem 0 0;
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: #f6f0e4;
    }

    body[data-status="paused"] .time { opacity: 0.8; }

    .companion {
      width: 148px;
      height: auto;
      margin: 0.35rem 0 0.2rem;
      display: block;
      transform-origin: 50% 70%;
    }

    body[data-status="running"] .companion {
      animation: sway 3.4s ease-in-out infinite;
    }

    .companion-z {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    body[data-mode="short"] .companion-z,
    body[data-mode="long"] .companion-z {
      opacity: 1;
      animation: rise 3.2s ease-in-out infinite;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 0.85rem;
    }

    .controls button {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }

    .controls button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .controls button:not(:disabled):hover { filter: brightness(1.08); }

    .controls button:not(:disabled):active { transform: translateY(1px); }

    #start { background: #e0a23a; color: #2a2108; }
    #pause,
    #next { background: #4a4268; color: #f6f0e4; }
    #reset { background: #3c3654; color: #f6f0e4; }
    #end { background: #6b4552; color: #ffd5d8; }

    @media (max-width: 380px) {
      .time { font-size: 3.25rem; }
      .controls button { padding: 0 12px; }
    }

    @media (max-height: 700px) {
      .companion { width: 104px; }
      .time { font-size: 3.5rem; }
      .card { padding: 1.15rem 1.1rem 1rem; }
      .message { margin-top: 0.6rem; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(18px); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }

    @keyframes rise {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(-8px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb,
      body[data-status="running"] .companion,
      body[data-mode="short"] .companion-z,
      body[data-mode="long"] .companion-z,
      .mode,
      .controls button {
        animation: none;
        transition: none;
      }

      .controls button:not(:disabled):active { transform: none; }
    }
  </style>
</head>
<body data-mode="focus" data-status="idle">
  <div class="orbs" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <main>
    <h1 class="sr-only">Pomodoro de estudio</h1>
    <section class="card">
      <p class="count" id="count">Pomodoro 0</p>
      <p class="message" id="message" aria-live="polite">Sin prisa. Empieza cuando quieras.</p>
      <p class="mode" id="mode">Tiempo de concentración</p>
      <p class="time" id="time">25:00</p>
      <svg class="companion" viewBox="0 0 160 120" aria-hidden="true">
        <g class="companion-body">
          <circle cx="74" cy="68" r="34" fill="#d9c7f2"/>
          <circle cx="60" cy="56" r="12" fill="#f6f0e4" opacity="0.28"/>
          <path d="M58 66 q7 7 14 0" fill="none" stroke="#2a2340" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M80 66 q7 7 14 0" fill="none" stroke="#2a2340" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M66 82 q10 7 18 0" fill="none" stroke="#2a2340" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="54" cy="76" r="3.2" fill="#d9899a"/>
          <circle cx="98" cy="76" r="3.2" fill="#d9899a"/>
          <path d="M74 22 l2.2 6.2 6.2 2.2 -6.2 2.2 -2.2 6.2 -2.2 -6.2 -6.2 -2.2 6.2 -2.2 z" fill="#f0d9a0"/>
        </g>
        <g class="companion-z">
          <text x="116" y="48" fill="#f0d9a0" font-size="22" font-family="Georgia, 'Palatino Linotype', Palatino, serif">z</text>
        </g>
      </svg>
      <div class="controls">
        <button type="button" id="start">Empezar</button>
        <button type="button" id="pause" disabled>Pausar</button>
        <button type="button" id="next" disabled>Siguiente</button>
        <button type="button" id="reset" disabled>Reiniciar</button>
        <button type="button" id="end" disabled>Terminar</button>
      </div>
    </section>
  </main>

  <script>
    var DURATIONS = { focus: 1500, short: 300, long: 900 };
    var LONG_EVERY = 4;

    var MODE_LABELS = {
      focus: "Tiempo de concentración",
      short: "Descanso corto",
      long: "Descanso largo"
    };

    var TITLE_LABELS = {
      focus: "Concentración",
      short: "Descanso corto",
      long: "Descanso largo"
    };

    var MESSAGES = {
      idle: "Sin prisa. Empieza cuando quieras.",
      focus: "Un minuto detrás de otro.",
      paused: "La pausa también vale. Quédate lo que necesites.",
      rest: "Descansar también es estudiar.",
      done: "Bien. Has estado aquí."
    };

    function createInitialState() {
      return {
        mode: "focus",
        status: "idle",
        remaining: DURATIONS.focus,
        completed: 0,
        endsAt: null
      };
    }

    function formatTime(seconds) {
      var safe = Math.max(0, Math.floor(seconds));
      var minutes = Math.floor(safe / 60);
      var secs = safe % 60;
      return String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    }

    function phaseAfter(state) {
      if (state.mode !== "focus") return "focus";
      var nextCount = state.completed + 1;
      return nextCount % LONG_EVERY === 0 ? "long" : "short";
    }

    function secondsLeft(state, now) {
      if (state.endsAt == null) return state.remaining;
      return Math.max(0, Math.ceil((state.endsAt - now) / 1000));
    }

    function advance(state, now) {
      var completed = state.mode === "focus" ? state.completed + 1 : state.completed;
      var mode = phaseAfter(state);
      var duration = DURATIONS[mode];
      return {
        mode: mode,
        status: "running",
        remaining: duration,
        completed: completed,
        endsAt: now + duration * 1000
      };
    }

    function startPhase(state, now) {
      var duration = DURATIONS[state.mode];
      return {
        mode: state.mode,
        status: "running",
        remaining: duration,
        completed: state.completed,
        endsAt: now + duration * 1000
      };
    }

    function pause(state, now) {
      return {
        mode: state.mode,
        status: "paused",
        remaining: secondsLeft(state, now),
        completed: state.completed,
        endsAt: null
      };
    }

    function resume(state, now) {
      return {
        mode: state.mode,
        status: "running",
        remaining: state.remaining,
        completed: state.completed,
        endsAt: now + state.remaining * 1000
      };
    }

    function tick(state, now) {
      if (state.status !== "running") return state;
      var remaining = secondsLeft(state, now);
      if (remaining <= 0) return advance(state, now);
      if (remaining === state.remaining) return state;
      return {
        mode: state.mode,
        status: state.status,
        remaining: remaining,
        completed: state.completed,
        endsAt: state.endsAt
      };
    }

    function skip(state, now) {
      return advance(state, now);
    }

    function reset() {
      return createInitialState();
    }

    function endSession(state, now) {
      return {
        mode: state.mode,
        status: "done",
        remaining: secondsLeft(state, now),
        completed: state.completed,
        endsAt: null
      };
    }

    function beginAgain(state, now) {
      return startPhase(state, now);
    }

    function controls(state) {
      var status = state.status;
      return {
        start: status === "idle" || status === "paused" || status === "done",
        pause: status === "running",
        next: status === "running" || status === "paused",
        reset: status !== "idle",
        end: status === "running" || status === "paused"
      };
    }

    function copyFor(state) {
      var message = MESSAGES.idle;
      if (state.status === "done") message = MESSAGES.done;
      else if (state.status === "paused") message = MESSAGES.paused;
      else if (state.status === "running" && state.mode === "focus") message = MESSAGES.focus;
      else if (state.status === "running") message = MESSAGES.rest;

      var modeLabel = MODE_LABELS[state.mode];
      var title = modeLabel;
      if (state.status === "running" || state.status === "paused") {
        title = formatTime(state.remaining) + " · " + TITLE_LABELS[state.mode];
      }

      return {
        count: "Pomodoro " + state.completed,
        message: message,
        modeLabel: modeLabel,
        title: title
      };
    }

    var countEl = document.getElementById("count");
    var messageEl = document.getElementById("message");
    var modeEl = document.getElementById("mode");
    var timeEl = document.getElementById("time");
    var startBtn = document.getElementById("start");
    var pauseBtn = document.getElementById("pause");
    var nextBtn = document.getElementById("next");
    var resetBtn = document.getElementById("reset");
    var endBtn = document.getElementById("end");

    var state = createInitialState();
    var timerId = null;
    var audioCtx = null;

    function render(nextState) {
      var copy = copyFor(nextState);
      var enabled = controls(nextState);
      document.body.dataset.mode = nextState.mode;
      document.body.dataset.status = nextState.status;
      document.title = copy.title;
      countEl.textContent = copy.count;
      messageEl.textContent = copy.message;
      modeEl.textContent = copy.modeLabel;
      timeEl.textContent = formatTime(nextState.remaining);
      startBtn.disabled = !enabled.start;
      pauseBtn.disabled = !enabled.pause;
      nextBtn.disabled = !enabled.next;
      resetBtn.disabled = !enabled.reset;
      endBtn.disabled = !enabled.end;
    }

    function ensureAudio() {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playChime() {
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      var startAt = audioCtx.currentTime;
      [523.25, 659.25].forEach(function (freq, index) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var noteAt = startAt + index * 0.18;
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, noteAt);
        gain.gain.exponentialRampToValueAtTime(0.06, noteAt + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, noteAt + 0.38);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(noteAt);
        osc.stop(noteAt + 0.4);
      });
    }

    function syncTimer() {
      var shouldRun = state.status === "running";
      if (shouldRun && timerId == null) {
        timerId = setInterval(onTick, 250);
      } else if (!shouldRun && timerId != null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function commit(nextState) {
      state = nextState;
      syncTimer();
      render(state);
    }

    function onTick() {
      var previous = state;
      var nextState = tick(previous, Date.now());
      if (nextState === previous) return;
      state = nextState;
      if (nextState.mode !== previous.mode) playChime();
      render(state);
    }

    startBtn.addEventListener("click", function () {
      ensureAudio();
      var now = Date.now();
      var nextState = state.status === "paused"
        ? resume(state, now)
        : state.status === "done"
          ? beginAgain(state, now)
          : startPhase(state, now);
      commit(nextState);
    });

    pauseBtn.addEventListener("click", function () {
      commit(pause(state, Date.now()));
    });

    nextBtn.addEventListener("click", function () {
      commit(skip(state, Date.now()));
    });

    resetBtn.addEventListener("click", function () {
      commit(reset());
    });

    endBtn.addEventListener("click", function () {
      commit(endSession(state, Date.now()));
    });

    render(state);
  </script>
</body>
</html>
