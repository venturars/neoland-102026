<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro</title>
  <style>
    :root {
      --night: #100c14;
      --mist: #2a1830;
      --card: #1c1524;
      --line: #3a3144;
      --bone: #f4ecdf;
      --fog: #b7aab8;
      --ember: #e25b45;
      --ember-dark: #8e2f2a;
      --ghost: #8fb8b2;
      --candle: #e2a85a;
      --ash: #8a7d90;
      --ink: #1a0c0c;
      --accent: var(--ember);
      --ring-length: 326.73;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: safe center;
      padding: 1rem;
      background: radial-gradient(ellipse at center, var(--mist), var(--night) 72%);
      color: var(--bone);
      font-family: "Segoe UI", system-ui, sans-serif;
      color-scheme: dark;
    }

    .card {
      width: min(26rem, 100%);
      padding: 1.5rem 1.25rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.75rem;
      box-shadow: 0 24px 60px rgb(0 0 0 / 0.45);
    }

    .heading {
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 0.2rem;
      color: var(--fog);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-family: Georgia, "Palatino Linotype", Palatino, serif;
      font-size: 2rem;
      font-weight: normal;
      line-height: 1.1;
    }

    .stage {
      position: relative;
      width: 6rem;
      height: 6rem;
      margin: 0 auto 0.25rem;
    }

    .moon {
      position: absolute;
      top: -0.55rem;
      left: -0.9rem;
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: var(--bone);
      opacity: 0.22;
    }

    .character {
      position: relative;
      width: 100%;
      height: 100%;
      animation: float 3.2s ease-in-out infinite;
    }

    .character svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ghost-body {
      fill: var(--bone);
    }

    .eye {
      fill: var(--ink);
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.6s ease-in-out infinite;
    }

    .eye-right {
      animation-delay: 0.05s;
    }

    .pupil {
      fill: var(--ink);
    }

    .mouth {
      fill: var(--ink);
    }

    .timer {
      display: grid;
      place-items: center;
      width: min(15rem, 100%);
      margin: 0 auto 1rem;
    }

    .ring,
    .timer-readout {
      grid-area: 1 / 1;
    }

    .ring {
      width: 100%;
      height: auto;
    }

    .ring-track,
    .ring-value {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .ring-track {
      stroke: var(--line);
    }

    .ring-value {
      stroke: var(--accent);
      stroke-dasharray: var(--ring-length);
      stroke-dashoffset: 0;
      transform: rotate(-90deg);
      transform-origin: 60px 60px;
      transition: stroke 400ms ease, stroke-dashoffset 400ms linear;
    }

    .timer-readout {
      text-align: center;
    }

    .time {
      margin: 0;
      font-size: clamp(2.75rem, 12vw, 3.75rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .status {
      margin: 0.35rem 0 0;
      color: var(--fog);
      font-size: 0.95rem;
    }

    .score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .count {
      margin: 0;
      color: var(--fog);
      font-size: 0.95rem;
    }

    .dots {
      display: flex;
      gap: 0.4rem;
    }

    .dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: var(--line);
    }

    .dot.is-filled {
      background: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn {
      min-height: 44px;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--bone);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      grid-column: 1 / -1;
      border-color: var(--accent);
      background: var(--accent);
      color: var(--ink);
    }

    .btn:hover:not(:disabled) {
      border-color: var(--fog);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(0.92);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn:focus-visible {
      outline: 2px solid var(--bone);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    [data-mode="study"] {
      --accent: var(--ember);
    }

    [data-mode="shortBreak"] {
      --accent: var(--ghost);
    }

    [data-mode="longBreak"] {
      --accent: var(--candle);
    }

    [data-mode="study"] .btn-primary:hover:not(:disabled) {
      border-color: var(--ember-dark);
      background: var(--ember-dark);
      color: var(--bone);
      filter: none;
    }

    [data-status="running"][data-mode="study"] .character {
      animation-duration: 2.2s;
    }

    [data-status="running"] .pupil {
      fill: var(--accent);
    }

    [data-mode="shortBreak"] .character,
    [data-mode="longBreak"] .character {
      animation-duration: 4s;
    }

    [data-status="paused"] .character {
      animation-play-state: paused;
    }

    [data-status="paused"] .eye {
      animation: none;
      transform: scaleY(0.18);
    }

    [data-status="paused"] .ring-value,
    [data-status="paused"] .status {
      stroke: var(--ash);
      color: var(--ash);
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes blink {
      0%,
      46%,
      52%,
      100% {
        transform: scaleY(1);
      }
      49% {
        transform: scaleY(0.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="card" data-mode="study" data-status="idle">
    <header class="heading">
      <p class="eyebrow">Pomodoro</p>
      <h1 id="mode-label">Study</h1>
    </header>

    <div class="stage">
      <div class="moon" aria-hidden="true"></div>
      <div class="character">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <path class="ghost-body" d="M48 8C28 8 16 30 16 48v28c6-12 12-10 16 0s10 10 16 0 10-12 16 0 12-10 16 0V48C80 30 68 8 48 8z"></path>
          <g class="eye eye-left">
            <ellipse cx="35" cy="42" rx="6.5" ry="10"></ellipse>
            <ellipse class="pupil" cx="36.2" cy="46" rx="2.2" ry="3.2"></ellipse>
          </g>
          <g class="eye eye-right">
            <ellipse cx="61" cy="45" rx="5.2" ry="8.2"></ellipse>
            <ellipse class="pupil" cx="62" cy="48.2" rx="1.8" ry="2.6"></ellipse>
          </g>
          <ellipse class="mouth" cx="49" cy="66" rx="3.4" ry="5.2"></ellipse>
        </svg>
      </div>
    </div>

    <div class="timer">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
        <circle class="ring-value" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="timer-readout">
        <p id="time" class="time">25:00</p>
        <p id="status" class="status">Ready</p>
      </div>
    </div>

    <div class="score">
      <p id="count" class="count">0 pomodoros</p>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="btn btn-primary" data-action="start">Start</button>
      <button type="button" class="btn" data-action="pause" disabled>Pause</button>
      <button type="button" class="btn" data-action="next">Next</button>
      <button type="button" class="btn" data-action="reset">Reset</button>
      <button type="button" class="btn" data-action="end">End</button>
    </div>

    <p id="live" class="sr-only" aria-live="polite">Ready. Study. 25:00.</p>
  </main>
  <script>
    const CYCLE = [
      "study",
      "shortBreak",
      "study",
      "shortBreak",
      "study",
      "shortBreak",
      "study",
      "longBreak"
    ];

    const DURATIONS_MS = {
      study: 25 * 60 * 1000,
      shortBreak: 5 * 60 * 1000,
      longBreak: 15 * 60 * 1000
    };

    const MODE_LABELS = {
      study: "Study",
      shortBreak: "Short break",
      longBreak: "Long break"
    };

    const RING_LENGTH = 326.73;
    const TICK_MS = 250;

    const nodes = {
      app: document.querySelector("#app"),
      modeLabel: document.querySelector("#mode-label"),
      time: document.querySelector("#time"),
      status: document.querySelector("#status"),
      count: document.querySelector("#count"),
      dots: Array.from(document.querySelectorAll(".dot")),
      start: document.querySelector("[data-action='start']"),
      pause: document.querySelector("[data-action='pause']"),
      next: document.querySelector("[data-action='next']"),
      reset: document.querySelector("[data-action='reset']"),
      end: document.querySelector("[data-action='end']"),
      ring: document.querySelector(".ring-value"),
      live: document.querySelector("#live")
    };

    let state;
    let announcedKey = "";
    let timerId = null;
    let audioContext = null;

    function createState() {
      return {
        step: 0,
        status: "idle",
        remainingMs: DURATIONS_MS.study,
        endsAt: null,
        completedPomodoros: 0
      };
    }

    function modeOf(current) {
      return CYCLE[current.step];
    }

    function durationOf(mode) {
      return DURATIONS_MS[mode];
    }

    function remainingOf(current, now) {
      if (current.status !== "running" || current.endsAt === null) {
        return current.remainingMs;
      }
      return Math.max(0, current.endsAt - now);
    }

    function formatClock(ms) {
      const totalSeconds = Math.ceil(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const pad = function (value) {
        return String(value).padStart(2, "0");
      };
      return pad(minutes) + ":" + pad(seconds);
    }

    function progressRatio(current, now) {
      return remainingOf(current, now) / durationOf(modeOf(current));
    }

    function statusLabel(current) {
      if (current.status === "paused") {
        return "Paused";
      }
      if (current.status === "running" && modeOf(current) === "study") {
        return "Studying";
      }
      if (current.status === "running") {
        return MODE_LABELS[modeOf(current)];
      }
      return "Ready";
    }

    function filledDots(current) {
      const done = current.completedPomodoros;
      if (modeOf(current) === "longBreak" && done > 0 && done % 4 === 0) {
        return 4;
      }
      return done % 4;
    }

    function countLabel(current) {
      const total = current.completedPomodoros;
      const word = total === 1 ? "pomodoro" : "pomodoros";
      return total + " " + word;
    }

    function formatTitle(current, now) {
      const freshStudy = current.status === "idle"
        && current.step === 0
        && current.completedPomodoros === 0
        && current.remainingMs === DURATIONS_MS.study;
      if (freshStudy) {
        return "Pomodoro";
      }
      return formatClock(remainingOf(current, now)) + " · " + MODE_LABELS[modeOf(current)];
    }

    function startTimer(current, now) {
      if (current.status === "running") {
        return current;
      }
      const remainingMs = remainingOf(current, now);
      if (remainingMs <= 0) {
        return current;
      }
      return {
        step: current.step,
        status: "running",
        remainingMs: remainingMs,
        endsAt: now + remainingMs,
        completedPomodoros: current.completedPomodoros
      };
    }

    function pauseTimer(current, now) {
      if (current.status !== "running") {
        return current;
      }
      return {
        step: current.step,
        status: "paused",
        remainingMs: remainingOf(current, now),
        endsAt: null,
        completedPomodoros: current.completedPomodoros
      };
    }

    function advancePhase(current, countStudy) {
      const completedPomodoros = countStudy && modeOf(current) === "study"
        ? current.completedPomodoros + 1
        : current.completedPomodoros;
      const step = (current.step + 1) % CYCLE.length;
      const mode = CYCLE[step];
      return {
        step: step,
        status: "idle",
        remainingMs: DURATIONS_MS[mode],
        endsAt: null,
        completedPomodoros: completedPomodoros
      };
    }

    function skipToNext(current) {
      return advancePhase(current, false);
    }

    function finishInterval(current) {
      return advancePhase(current, true);
    }

    function resetInterval(current) {
      return {
        step: current.step,
        status: "idle",
        remainingMs: durationOf(modeOf(current)),
        endsAt: null,
        completedPomodoros: current.completedPomodoros
      };
    }

    function endSession(current) {
      return {
        step: 0,
        status: "idle",
        remainingMs: DURATIONS_MS.study,
        endsAt: null,
        completedPomodoros: current.completedPomodoros
      };
    }

    function applyTick(current, now) {
      if (current.status !== "running" || current.endsAt === null) {
        return { state: current, finished: false };
      }
      const remainingMs = Math.max(0, current.endsAt - now);
      if (remainingMs > 0) {
        return {
          state: {
            step: current.step,
            status: "running",
            remainingMs: remainingMs,
            endsAt: current.endsAt,
            completedPomodoros: current.completedPomodoros
          },
          finished: false
        };
      }
      return { state: finishInterval(current), finished: true };
    }

    function sharedAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        return null;
      }
      if (audioContext === null) {
        try {
          audioContext = new AudioCtx();
        } catch (error) {
          return null;
        }
      }
      return audioContext;
    }

    function unlockAudio() {
      const context = sharedAudio();
      if (context && context.state === "suspended") {
        context.resume();
      }
    }

    function playTone(context, frequency, when) {
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, when);
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.exponentialRampToValueAtTime(0.04, when + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.18);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(when);
      oscillator.stop(when + 0.2);
    }

    function playChime() {
      const context = sharedAudio();
      if (!context) {
        return;
      }
      try {
        const when = context.currentTime;
        playTone(context, 659.25, when);
        playTone(context, 783.99, when + 0.14);
      } catch (error) {
        return;
      }
    }

    function syncTicker(current) {
      const running = current.status === "running";
      if (running && timerId === null) {
        timerId = setInterval(function () {
          const result = applyTick(state, Date.now());
          state = result.state;
          if (result.finished) {
            playChime();
          }
          if (state.status !== "running") {
            syncTicker(state);
          }
          render(state);
        }, TICK_MS);
      }
      if (!running && timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function commit(nextState) {
      unlockAudio();
      state = nextState;
      syncTicker(state);
      render(state);
    }

    function render(current) {
      const now = Date.now();
      const mode = modeOf(current);
      const filled = filledDots(current);

      nodes.app.dataset.mode = mode;
      nodes.app.dataset.status = current.status;
      nodes.modeLabel.textContent = MODE_LABELS[mode];
      nodes.time.textContent = formatClock(remainingOf(current, now));
      nodes.status.textContent = statusLabel(current);
      nodes.count.textContent = countLabel(current);
      nodes.dots.forEach(function (dot, index) {
        dot.classList.toggle("is-filled", index < filled);
      });
      nodes.start.disabled = current.status === "running";
      nodes.pause.disabled = current.status !== "running";
      nodes.ring.style.strokeDashoffset = String(RING_LENGTH * (1 - progressRatio(current, now)));
      document.title = formatTitle(current, now);

      const key = current.status + ":" + mode;
      if (key !== announcedKey) {
        announcedKey = key;
        nodes.live.textContent = statusLabel(current) + ". " + MODE_LABELS[mode] + ". " + formatClock(remainingOf(current, now)) + ".";
      }
    }

    nodes.start.addEventListener("click", function () {
      commit(startTimer(state, Date.now()));
    });

    nodes.pause.addEventListener("click", function () {
      commit(pauseTimer(state, Date.now()));
    });

    nodes.next.addEventListener("click", function () {
      commit(skipToNext(state));
    });

    nodes.reset.addEventListener("click", function () {
      commit(resetInterval(state));
    });

    nodes.end.addEventListener("click", function () {
      commit(endSession(state));
    });

    state = createState();
    render(state);
  </script>
</body>
</html>
