<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f3">
  <title>ONE THING AT A TIME | Una cosa a la vez</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f6f3;
      --surface: #fffefa;
      --ink: #26383d;
      --muted: #697b7e;
      --line: #dce5e1;
      --blue: #526d78;
      --blue-dark: #3e5964;
      --sage: #dce9df;
      --sage-deep: #557763;
      --soft: #eef2ef;
      --ring: #b7ccc0;
      --shadow: 0 18px 50px rgba(42, 63, 63, .07);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 34px 20px;
      color: var(--ink);
      background-color: var(--page);
      background-image: radial-gradient(ellipse at 50% 0%, #ffffff 0%, transparent 56%);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
    }

    button, input { font: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand {
      margin: 0;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .12em;
    }

    .tagline {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .cycle-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .cycle-note::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sage-deep);
      content: "";
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(270px, .9fr);
      overflow: hidden;
      border: 1px solid rgba(220, 229, 225, .9);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .focus-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 530px;
      padding: clamp(28px, 5vw, 54px);
      background: linear-gradient(155deg, #f5f8f5 0%, #edf3ef 100%);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--sage-deep);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .task-label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 650;
    }

    .task-input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255, 254, 250, .88);
      font-size: 14px;
    }

    .task-input::placeholder { color: #8a9998; }

    .task-hint {
      min-height: 18px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .focus-reminder {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: auto;
      padding-top: 36px;
      color: var(--blue-dark);
      font-size: 14px;
      line-height: 1.6;
    }

    .reminder-mark {
      flex: 0 0 24px;
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 1px solid #c8d9ce;
      border-radius: 50%;
      color: var(--sage-deep);
      font-size: 13px;
    }

    .timer-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 42px 32px 38px;
      text-align: center;
    }

    .mode-label {
      min-height: 20px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .timer {
      margin: 0;
      color: var(--blue-dark);
      font-variant-numeric: tabular-nums;
      font-size: clamp(66px, 10vw, 94px);
      font-weight: 350;
      line-height: 1;
    }

    .status-message {
      min-height: 42px;
      max-width: 270px;
      margin: 18px 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .controls {
      display: grid;
      width: 100%;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .button {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--blue-dark);
      background: var(--surface);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background-color .15s ease, border-color .15s ease;
    }

    .button:hover:not(:disabled) { background: var(--soft); }
    .button:disabled { cursor: not-allowed; opacity: .45; }

    .button-primary {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    .button-primary:hover:not(:disabled) {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .button-start { grid-column: 1 / -1; min-height: 48px; }

    .button-quiet {
      border-color: transparent;
      background: transparent;
    }

    .progress {
      width: 100%;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .progress-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .progress-heading span:first-child { color: var(--muted); }
    .progress-count { color: var(--ink); font-weight: 700; }

    .dots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .dot {
      height: 5px;
      border-radius: 4px;
      background: #e5ebe7;
    }

    .dot.is-complete { background: var(--sage-deep); }

    .footer-note {
      margin: 18px 0 0;
      color: #7b8989;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 640px) {
      body { padding: 22px 14px; }
      .topbar { align-items: flex-start; margin-bottom: 18px; }
      .cycle-note { padding-top: 4px; font-size: 11px; }
      .workspace { grid-template-columns: 1fr; }
      .focus-panel { min-height: auto; padding: 28px 24px; }
      .focus-reminder { margin-top: 24px; padding-top: 0; }
      .timer-panel { padding: 32px 24px 28px; }
      .timer { font-size: 76px; }
      .status-message { margin-bottom: 20px; }
      .progress { margin-top: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 class="brand">ONE THING AT A TIME</h1>
        <p class="tagline">Una cosa a la vez.</p>
      </div>
      <span class="cycle-note">A tu ritmo</span>
    </header>

    <section class="workspace" aria-label="Temporizador Pomodoro">
      <section class="focus-panel" aria-labelledby="task-label">
        <p class="eyebrow">Tu espacio de enfoque</p>
        <label class="task-label" id="task-label" for="task-input">¿En qué te vas a enfocar ahora?</label>
        <input class="task-input" id="task-input" type="text" maxlength="120" placeholder="Por ejemplo: terminar el ejercicio de arrays" autocomplete="off">
        <p class="task-hint" id="task-hint">Una tarea concreta es suficiente.</p>
        <div class="focus-reminder">
          <span class="reminder-mark" aria-hidden="true">i</span>
          <span id="focus-message">Por ahora, solo importa esta tarea.</span>
        </div>
      </section>

      <section class="timer-panel" aria-label="Control de sesión">
        <p class="mode-label" id="mode-label">Concentración</p>
        <p class="timer" id="timer" role="timer" aria-live="off">25:00</p>
        <p class="status-message" id="status-message" aria-live="polite">No necesitas hacerlo todo al mismo tiempo.</p>

        <div class="controls">
          <button class="button button-primary button-start" id="start-button" type="button">Iniciar</button>
          <button class="button" id="pause-button" type="button" disabled>Pausar</button>
          <button class="button" id="next-button" type="button">Siguiente</button>
          <button class="button" id="reset-button" type="button">Reiniciar</button>
          <button class="button button-quiet" id="finish-button" type="button">Terminar</button>
        </div>

        <div class="progress" aria-label="Progreso del ciclo">
          <div class="progress-heading">
            <span>Pomodoros completados</span>
            <span class="progress-count" id="progress-count">0 / 4</span>
          </div>
          <div class="dots" id="progress-dots" aria-hidden="true">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>
      </section>
    </section>
    <p class="footer-note">Un pequeño avance también cuenta.</p>
  </main>

  <script>
    (() => {
      const DURATIONS = { focus: 25 * 60, shortBreak: 5 * 60, longBreak: 15 * 60 };
      const MESSAGES = {
        focus: "No necesitas hacerlo todo al mismo tiempo.",
        shortBreak: "Es momento de descansar. Suelta los hombros.",
        longBreak: "Has llegado a una pausa larga. Tómate tu tiempo."
      };
      const MODES = { focus: "Concentración", shortBreak: "Descanso corto", longBreak: "Descanso largo" };
      const elements = {
        timer: document.querySelector("#timer"),
        mode: document.querySelector("#mode-label"),
        status: document.querySelector("#status-message"),
        focusMessage: document.querySelector("#focus-message"),
        task: document.querySelector("#task-input"),
        taskHint: document.querySelector("#task-hint"),
        count: document.querySelector("#progress-count"),
        dots: [...document.querySelectorAll(".dot")],
        start: document.querySelector("#start-button"),
        pause: document.querySelector("#pause-button"),
        next: document.querySelector("#next-button"),
        reset: document.querySelector("#reset-button"),
        finish: document.querySelector("#finish-button")
      };

      let mode = "focus";
      let completed = 0;
      let remaining = DURATIONS[mode];
      let timerId = null;
      let deadline = 0;
      let isRunning = false;

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainder = seconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
      }

      function render() {
        elements.timer.textContent = formatTime(remaining);
        elements.mode.textContent = MODES[mode];
        elements.status.textContent = MESSAGES[mode];
        elements.count.textContent = `${completed} / 4`;
        elements.dots.forEach((dot, index) => dot.classList.toggle("is-complete", index < completed));
        elements.start.disabled = isRunning;
        elements.pause.disabled = !isRunning;
        document.title = `${formatTime(remaining)} · ${MODES[mode]} | ONE THING AT A TIME`;
      }

      function setMode(nextMode) {
        mode = nextMode;
        remaining = DURATIONS[mode];
        render();
      }

      function stopClock() {
        if (timerId !== null) window.clearInterval(timerId);
        timerId = null;
        isRunning = false;
      }

      function advance(completedNaturally = false) {
        stopClock();
        if (mode === "focus") {
          if (completedNaturally) {
            completed = Math.min(completed + 1, 4);
            elements.status.textContent = "Terminaste una etapa. Bien hecho.";
          }
          setMode(completed === 4 ? "longBreak" : "shortBreak");
          return;
        }

        if (mode === "longBreak") completed = 0;
        setMode("focus");
        elements.status.textContent = "Cuando quieras, puedes empezar otra etapa.";
      }

      function tick() {
        remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        if (remaining === 0) {
          advance(mode === "focus");
          return;
        }
        render();
      }

      function start() {
        if (isRunning) return;
        if (remaining <= 0) remaining = DURATIONS[mode];
        isRunning = true;
        deadline = Date.now() + remaining * 1000;
        timerId = window.setInterval(tick, 250);
        render();
      }

      function pause() {
        if (!isRunning) return;
        remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        stopClock();
        render();
      }

      function reset() {
        stopClock();
        remaining = DURATIONS[mode];
        render();
      }

      function finish() {
        stopClock();
        completed = 0;
        mode = "focus";
        remaining = DURATIONS.focus;
        elements.status.textContent = "Sesión terminada. Puedes volver cuando quieras.";
        render();
      }

      elements.start.addEventListener("click", start);
      elements.pause.addEventListener("click", pause);
      elements.next.addEventListener("click", () => advance(false));
      elements.reset.addEventListener("click", reset);
      elements.finish.addEventListener("click", finish);
      elements.task.addEventListener("input", () => {
        const hasTask = elements.task.value.trim().length > 0;
        elements.focusMessage.textContent = hasTask
          ? `Ahora, un paso a la vez: ${elements.task.value.trim()}`
          : "Por ahora, solo importa esta tarea.";
        elements.taskHint.textContent = hasTask ? "Tu tarea queda aquí mientras te concentras." : "Una tarea concreta es suficiente.";
      });

      render();
    })();
  </script>
</body>
</html>
