<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a8f5c">
  <meta name="description" content="Pomodoro de gimnasio: 25 min ejercicio, 5 min descanso.">
  <title>Gymodoro · 25 / 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --work: #1a8f5c;
      --work-deep: #0f5c3a;
      --rest: #e8873a;
      --rest-deep: #b85c18;
      --fg: #fffaf2;
      --muted: rgba(255, 250, 242, 0.72);
      --ink: #142018;
      --btn: #fffaf2;
      --btn-ink: #142018;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --pulse: 1.4s;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--fg);
      background: var(--work);
      overflow: hidden;
      transition: background-color 0.65s var(--ease);
      -webkit-font-smoothing: antialiased;
    }

    body.phase-rest { background: var(--rest); }
    body.phase-rest { --theme-deep: var(--rest-deep); }
    body.phase-work { --theme-deep: var(--work-deep); }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%, rgba(255, 255, 255, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 100%, rgba(0, 0, 0, 0.12), transparent 50%);
      z-index: 0;
    }

    body.flash::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.35);
      animation: flash 0.45s var(--ease) forwards;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding:
        max(1.25rem, env(safe-area-inset-top))
        max(1.25rem, env(safe-area-inset-right))
        max(1.5rem, env(safe-area-inset-bottom))
        max(1.25rem, env(safe-area-inset-left));
      gap: 0.75rem;
    }

    .top {
      text-align: center;
      width: min(100%, 28rem);
    }

    .phase {
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(1.75rem, 7vw, 2.6rem);
      letter-spacing: 0.08em;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
    }

    .round {
      margin: 0.35rem 0 0;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0.5rem, 2vh, 1.25rem);
      width: 100%;
    }

    /* —— Muñeco de gym —— */
    .buddy-wrap {
      width: min(52vw, 220px);
      aspect-ratio: 1;
      position: relative;
    }

    .buddy {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .buddy .arm-l,
    .buddy .arm-r,
    .buddy .barbell,
    .buddy .leg-l,
    .buddy .leg-r,
    .buddy .body-group {
      transform-box: fill-box;
      transform-origin: center;
    }

    body.status-running.phase-work .buddy .arm-l,
    body.status-running.phase-work .buddy .arm-r,
    body.status-running.phase-work .buddy .barbell {
      animation: lift 1.1s ease-in-out infinite;
    }

    body.status-running.phase-work .buddy .body-group {
      animation: bounce 1.1s ease-in-out infinite;
    }

    body.status-running.phase-rest .buddy .body-group {
      animation: sway 2.4s ease-in-out infinite;
    }

    body.status-running.phase-rest .buddy .arm-l {
      animation: wave 1.6s ease-in-out infinite;
    }

    body.status-idle .buddy .eye-open { opacity: 1; }
    body.status-idle .buddy .eye-sleep { opacity: 0; }
    body.phase-rest .buddy .eye-open { opacity: 0; }
    body.phase-rest .buddy .eye-sleep { opacity: 1; }
    body.phase-work .buddy .eye-open { opacity: 1; }
    body.phase-work .buddy .eye-sleep { opacity: 0; }

    body.status-running.phase-work .buddy .sweat {
      animation: drip 1.2s ease-in infinite;
    }

    body:not(.status-running.phase-work) .buddy .sweat {
      opacity: 0;
    }

    body.phase-rest .buddy .barbell {
      opacity: 0.25;
      transform: translateY(18px) scale(0.85);
      transition: opacity 0.4s, transform 0.4s var(--ease);
    }

    body.phase-work .buddy .barbell {
      opacity: 1;
      transition: opacity 0.4s, transform 0.4s var(--ease);
    }

    body.phase-rest .buddy .smoothie {
      opacity: 1;
    }

    body.phase-work .buddy .smoothie {
      opacity: 0;
    }

    @keyframes lift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes drip {
      0% { opacity: 0; transform: translateY(0); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateY(12px); }
    }

    .speech {
      min-height: 1.4em;
      margin: 0;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.18);
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      font-weight: 800;
      text-align: center;
      max-width: 18rem;
    }

    .timer {
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(5rem, 22vw, 8.5rem);
      letter-spacing: 0.04em;
      line-height: 0.9;
      tabular-nums: true;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.14);
    }

    body.status-running .timer {
      animation: tickPulse var(--pulse) ease-in-out infinite;
    }

    @keyframes tickPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      width: min(100%, 26rem);
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      border: none;
      border-radius: 1.1rem;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      min-height: 3.5rem;
      padding: 0.85rem 1.4rem;
      transition: transform 0.15s var(--ease), opacity 0.2s;
    }

    button:active { transform: scale(0.96); }
    button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.9);
      outline-offset: 3px;
    }

    .btn-primary {
      flex: 1 1 9rem;
      background: var(--btn);
      color: var(--btn-ink);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
    }

    .btn-ghost {
      flex: 0 1 auto;
      min-width: 6.5rem;
      background: rgba(0, 0, 0, 0.22);
      color: var(--fg);
    }

    .btn-primary[hidden],
    .btn-ghost[hidden] {
      display: none;
    }

    .hint {
      margin: 0.15rem 0 0;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body class="phase-work status-idle">
  <div class="app">
    <header class="top">
      <p class="phase" id="phaseLabel">EJERCICIO</p>
      <p class="round" id="roundLabel">Ronda 1</p>
    </header>

    <main class="stage">
      <div class="buddy-wrap" aria-hidden="true">
        <svg class="buddy" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- sombra -->
          <ellipse cx="100" cy="186" rx="42" ry="8" fill="rgba(0,0,0,0.18)"/>

          <g class="body-group">
            <!-- piernas -->
            <g class="leg-l">
              <rect x="72" y="128" width="18" height="42" rx="9" fill="#2b2118"/>
              <rect x="68" y="160" width="26" height="12" rx="6" fill="#ff5a36"/>
            </g>
            <g class="leg-r">
              <rect x="110" y="128" width="18" height="42" rx="9" fill="#2b2118"/>
              <rect x="106" y="160" width="26" height="12" rx="6" fill="#ff5a36"/>
            </g>

            <!-- torso / tank -->
            <rect x="68" y="78" width="64" height="58" rx="18" fill="#ffd166"/>
            <path d="M78 78h44c0 14-8 22-22 22S78 92 78 78Z" fill="#fff6d8" opacity="0.55"/>
            <!-- abdominales graciosos -->
            <rect x="88" y="100" width="10" height="8" rx="2" fill="#e8b84a"/>
            <rect x="102" y="100" width="10" height="8" rx="2" fill="#e8b84a"/>
            <rect x="88" y="112" width="10" height="8" rx="2" fill="#e8b84a"/>
            <rect x="102" y="112" width="10" height="8" rx="2" fill="#e8b84a"/>

            <!-- brazo izq -->
            <g class="arm-l">
              <rect x="42" y="82" width="28" height="14" rx="7" fill="#ffd166"/>
              <circle cx="42" cy="89" r="11" fill="#ffd166"/>
            </g>
            <!-- brazo der -->
            <g class="arm-r">
              <rect x="130" y="82" width="28" height="14" rx="7" fill="#ffd166"/>
              <circle cx="158" cy="89" r="11" fill="#ffd166"/>
            </g>

            <!-- cabeza -->
            <circle cx="100" cy="52" r="28" fill="#ffd166"/>
            <!-- pelo / cinta -->
            <path d="M74 48c4-18 48-18 52 0-8-8-44-8-52 0Z" fill="#2b2118"/>
            <rect x="72" y="42" width="56" height="10" rx="5" fill="#3d7eff"/>
            <text x="100" y="50" text-anchor="middle" font-size="7" font-family="Nunito,sans-serif" font-weight="800" fill="#fff">GYM</text>

            <!-- cara -->
            <g class="eye-open">
              <ellipse cx="90" cy="54" rx="5" ry="6" fill="#142018"/>
              <ellipse cx="110" cy="54" rx="5" ry="6" fill="#142018"/>
              <circle cx="91.5" cy="52" r="1.6" fill="#fff"/>
              <circle cx="111.5" cy="52" r="1.6" fill="#fff"/>
            </g>
            <g class="eye-sleep">
              <path d="M84 54h12" stroke="#142018" stroke-width="3" stroke-linecap="round"/>
              <path d="M104 54h12" stroke="#142018" stroke-width="3" stroke-linecap="round"/>
            </g>
            <!-- sonrisa / esfuerzo -->
            <path class="mouth-work" d="M90 66c4 6 16 6 20 0" fill="none" stroke="#142018" stroke-width="3" stroke-linecap="round"/>
            <!-- mejillas -->
            <circle cx="80" cy="62" r="4" fill="#ff8a6a" opacity="0.55"/>
            <circle cx="120" cy="62" r="4" fill="#ff8a6a" opacity="0.55"/>

            <!-- sudor -->
            <g class="sweat">
              <ellipse cx="128" cy="40" rx="3" ry="5" fill="#7ec8ff"/>
            </g>

            <!-- batido de descanso -->
            <g class="smoothie">
              <rect x="148" y="100" width="18" height="28" rx="4" fill="#ff6b9d"/>
              <rect x="150" y="96" width="14" height="6" rx="2" fill="#fff"/>
              <path d="M157 96 V88" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <circle cx="157" cy="86" r="3" fill="#7CFF6B"/>
            </g>
          </g>

          <!-- barra -->
          <g class="barbell">
            <rect x="28" y="84" width="144" height="6" rx="3" fill="#3a3a3a"/>
            <rect x="22" y="76" width="14" height="22" rx="3" fill="#888"/>
            <rect x="14" y="80" width="10" height="14" rx="2" fill="#bbb"/>
            <rect x="164" y="76" width="14" height="22" rx="3" fill="#888"/>
            <rect x="176" y="80" width="10" height="14" rx="2" fill="#bbb"/>
          </g>
        </svg>
      </div>

      <p class="speech" id="speech">¿Listo para machacar hierro?</p>
      <p class="timer" id="timer" aria-live="polite">25:00</p>
    </main>

    <footer>
      <div class="controls">
        <button type="button" class="btn-primary" id="btnStart">Start</button>
        <button type="button" class="btn-primary" id="btnPause" hidden>Pause</button>
        <button type="button" class="btn-ghost" id="btnReset">Reset</button>
      </div>
      <p class="hint">25 min ejercicio · 5 min descanso</p>
    </footer>
  </div>

  <script>
    (function () {
      const WORK_MS = 25 * 60 * 1000;
      const REST_MS = 5 * 60 * 1000;

      const SPEECH = {
        idle: "¿Listo para machacar hierro?",
        work: [
          "¡Arriba esa barra!",
          "¡Tú puedes, campeón!",
          "Sudor = progreso 💪",
          "Una más… vale, 24 min más",
          "¡No pares ahora!"
        ],
        rest: [
          "Batidito y a respirar…",
          "Descanso merecido 😴",
          "Hidratación mode ON",
          "Los músculos crecen aquí",
          "Cinco minutitos de gloria"
        ],
        alarmWorkDone: "¡25! A descansar, máquina",
        alarmRestDone: "¡Se acabó el relax! A darle"
      };

      const els = {
        body: document.body,
        phase: document.getElementById("phaseLabel"),
        round: document.getElementById("roundLabel"),
        timer: document.getElementById("timer"),
        speech: document.getElementById("speech"),
        btnStart: document.getElementById("btnStart"),
        btnPause: document.getElementById("btnPause"),
        btnReset: document.getElementById("btnReset")
      };

      const state = {
        phase: "work",
        status: "idle",
        remainingMs: WORK_MS,
        round: 1,
        endsAt: null,
        tickId: null,
        speechIdx: 0
      };

      let audioCtx = null;

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function formatMs(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return pad(m) + ":" + pad(s);
      }

      function ensureAudio() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(freq, start, dur) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      }

      function playAlarm() {
        const ctx = ensureAudio();
        if (ctx) {
          const t = ctx.currentTime;
          beep(660, t, 0.14);
          beep(880, t + 0.18, 0.14);
          beep(1100, t + 0.36, 0.22);
        }
        if (navigator.vibrate) {
          navigator.vibrate([180, 80, 180, 80, 240]);
        }
        els.body.classList.remove("flash");
        void els.body.offsetWidth;
        els.body.classList.add("flash");
      }

      function pickSpeech() {
        if (state.status === "idle") {
          els.speech.textContent = SPEECH.idle;
          return;
        }
        const list = state.phase === "work" ? SPEECH.work : SPEECH.rest;
        els.speech.textContent = list[state.speechIdx % list.length];
        state.speechIdx += 1;
      }

      function render() {
        els.timer.textContent = formatMs(state.remainingMs);
        els.phase.textContent = state.phase === "work" ? "EJERCICIO" : "DESCANSO";
        els.round.textContent = "Ronda " + state.round;

        els.body.classList.toggle("phase-work", state.phase === "work");
        els.body.classList.toggle("phase-rest", state.phase === "rest");
        els.body.classList.toggle("status-idle", state.status === "idle");
        els.body.classList.toggle("status-running", state.status === "running");
        els.body.classList.toggle("status-paused", state.status === "paused");

        const showPause = state.status === "running";
        els.btnPause.hidden = !showPause;
        els.btnStart.hidden = showPause;
        els.btnStart.textContent = state.status === "paused" ? "Start" : "Start";
      }

      function clearTick() {
        if (state.tickId) {
          clearInterval(state.tickId);
          state.tickId = null;
        }
      }

      function switchPhase() {
        playAlarm();
        if (state.phase === "work") {
          els.speech.textContent = SPEECH.alarmWorkDone;
          state.phase = "rest";
          state.remainingMs = REST_MS;
        } else {
          els.speech.textContent = SPEECH.alarmRestDone;
          state.phase = "work";
          state.round += 1;
          state.remainingMs = WORK_MS;
        }
        state.endsAt = Date.now() + state.remainingMs;
        render();
        setTimeout(pickSpeech, 2200);
      }

      function tick() {
        if (state.status !== "running" || state.endsAt == null) return;
        state.remainingMs = state.endsAt - Date.now();
        if (state.remainingMs <= 0) {
          state.remainingMs = 0;
          render();
          switchPhase();
          return;
        }
        render();
      }

      function start() {
        ensureAudio();
        if (state.status === "running") return;
        if (state.status === "idle") {
          state.remainingMs = state.phase === "work" ? WORK_MS : REST_MS;
        }
        state.status = "running";
        state.endsAt = Date.now() + state.remainingMs;
        clearTick();
        state.tickId = setInterval(tick, 200);
        pickSpeech();
        render();
      }

      function pause() {
        if (state.status !== "running") return;
        tick();
        state.status = "paused";
        state.endsAt = null;
        clearTick();
        els.speech.textContent = state.phase === "work"
          ? "Pausa… la barra te espera"
          : "Pausa del descanso (meta)";
        render();
      }

      function reset() {
        clearTick();
        state.phase = "work";
        state.status = "idle";
        state.remainingMs = WORK_MS;
        state.round = 1;
        state.endsAt = null;
        state.speechIdx = 0;
        els.speech.textContent = SPEECH.idle;
        render();
      }

      els.btnStart.addEventListener("pointerdown", ensureAudio);
      els.btnStart.addEventListener("click", start);
      els.btnPause.addEventListener("click", pause);
      els.btnReset.addEventListener("click", reset);

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible" && state.status === "running") {
          tick();
        }
      });

      render();
    })();
  </script>
</body>
</html>
