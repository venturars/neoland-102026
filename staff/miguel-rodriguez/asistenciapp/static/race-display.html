<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Carrera · AsistenciApp</title><link rel="stylesheet" href="race-theme.css"><link rel="stylesheet" href="race.css"><script type="module" src="race-display.js"></script></head>
<body class="race-ui"><main class="shell"><header class="masthead"><a id="panel" class="brand" href="profesor.html">neoland / carrera</a><button id="fullscreen" class="secondary small" type="button">Pantalla completa</button></header>
<div class="hero"><h1 id="race-title">Carrera</h1><span id="phase" class="phase-tag"></span></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<div id="race-content" class="layout" hidden><section class="race-stage"><div class="track-head"><h2 id="grid-title">Parrilla</h2></div>
<div id="finale-banner" hidden><h1 id="finale-heading" tabindex="-1"></h1><span id="finale-number" aria-hidden="true" hidden></span></div><p id="finale-announcement" class="sr-only" role="status" aria-live="polite"></p>
<ol id="grid" class="track" aria-label="Pilotos y estado de asistencia"></ol>
<section id="results" class="results" hidden aria-label="Resultados de la carrera"><h1 tabindex="-1">Podio</h1><div id="podium" class="podium"></div></section><h2 id="classification-title" hidden>Clasificación</h2><ol id="classification" class="result-list" aria-label="Clasificación completa"></ol><p id="unregistered" class="muted"></p>
</section><aside class="control-panel"><div id="lobby-controls" hidden><img id="qr" class="qr" alt="QR de entrada a la carrera"><a id="join-link" class="join-link" target="_blank" rel="noreferrer">Abrir entrada ↗</a><button id="copy-link" class="secondary small" type="button">Copiar enlace</button><div class="counter"><strong id="ready-count">0</strong><span>/ 15 listos</span></div><button id="go" type="button">Empezar</button></div>
<p id="countdown" class="countdown" hidden aria-live="polite"></p><div id="code-panel" hidden><p class="code-label">Código</p><p id="code" class="code"></p><p id="code-time" class="muted"></p></div><p id="progress" class="instructions"></p>
<button id="finish" class="secondary" type="button">Terminar carrera</button><div id="confirm-close" class="confirm" hidden><p>¿Terminar? Quienes no se hayan registrado quedarán sin puesto.</p><button id="confirm-no" class="secondary" type="button">Seguir esperando</button><button id="confirm-yes" type="button">Sí, terminar</button></div>
<div id="confirm-remove" class="confirm" hidden><p id="remove-question"></p><button id="remove-no" class="secondary" type="button">Cancelar</button><button id="remove-yes" type="button">Sí, quitar</button></div><button id="download" class="secondary" type="button">Descargar asistencia</button></aside></div></main></body></html>
