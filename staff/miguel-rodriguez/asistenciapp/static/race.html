<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Tu kart · AsistenciApp</title><link rel="stylesheet" href="race-theme.css"><link rel="stylesheet" href="race.css"><script type="module" src="race.js"></script></head>
<body class="race-ui"><main class="student-shell"><header class="masthead"><span class="brand">neoland / carrera</span><span class="edition">26</span></header>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="join-view" class="student-card" hidden><h1>Tu piloto</h1><form id="join-form"><label for="name">Tu nombre</label><select id="name" required><option value="">Selecciona tu nombre</option></select><button id="join-button" type="submit">Entrar</button></form></section>
<section id="own-view" class="student-card" hidden><p id="phase" class="phase-tag"></p><img id="own-kart" class="own-kart" alt=""><h1 id="own-name"></h1><p id="own-message"></p><p id="countdown" class="countdown" aria-live="polite" hidden></p>
<form id="code-form" hidden><div class="attempts"><span>Intentos</span><strong id="remaining"></strong></div><label for="code">Código del profesor</label><input id="code" class="student-code" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" maxlength="4" placeholder="0000" required><button id="send" type="submit">Confirmar</button></form>
<button id="retry" class="secondary" type="button" hidden>Reintentar el mismo envío</button><div id="result" hidden><p id="position" class="finish-position"></p><p id="result-time" class="muted"></p></div></section></main></body></html>
