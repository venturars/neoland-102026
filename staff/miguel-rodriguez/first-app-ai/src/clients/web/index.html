<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contactos · First app</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p>First app</p>
        <h1 tabindex="-1">Contactos</h1>
      </header>
      <p id="message" role="status" aria-live="polite"></p>
      <button id="gender-count" class="secondary" type="button">Resumen por nombre</button>
      <p id="gender-result" role="status" aria-live="polite"></p>
      <button id="random-pick" class="secondary" type="button">Elegir al azar</button>
      <p id="random-result" role="status" aria-live="polite"></p>
      <section id="selection" aria-labelledby="selection-title">
        <h2 id="selection-title">¿Quién eres?</h2>
        <ul id="users" aria-label="Contactos guardados"></ul>
        <div class="list-actions">
          <button id="reload" class="secondary" type="button">
            Volver a cargar
          </button>
        </div>
      </section>
      <section id="menu" hidden aria-labelledby="menu-title">
        <h2 id="menu-title"></h2>
        <p id="selected-email"></p>
        <div class="actions">
          <button id="edit" type="button">Modificar usuario</button>
          <button type="button" data-future disabled>
            Ir a notas · próximamente
          </button>
          <button id="back" class="secondary" type="button">Volver</button>
        </div>
      </section>
      <section id="editor" hidden aria-labelledby="editor-title">
        <h2 id="editor-title">Modificar usuario</h2>
        <form id="user-form" novalidate>
          <label for="name">Nombre</label>
          <input
            id="name"
            name="name"
            autocomplete="name"
            aria-describedby="name-error"
            required
          />
          <p id="name-error" class="field-error" role="alert"></p>
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="text"
            inputmode="email"
            autocomplete="email"
            aria-describedby="email-error"
            required
          />
          <p id="email-error" class="field-error" role="alert"></p>
          <div class="actions">
            <button id="save" type="submit">Guardar cambios</button>
            <button id="cancel" class="secondary" type="button">
              Volver sin guardar
            </button>
          </div>
          <div class="delete-action">
            <button id="delete" class="danger" type="button">
              Eliminar usuario
            </button>
          </div>
        </form>
        <div id="confirmation" hidden>
          <p>
            Para eliminar este usuario, escribe su email:
            <strong id="delete-email"></strong>
          </p>
          <form id="delete-form" novalidate>
            <label for="confirmation-email">Confirmar email</label>
            <input
              id="confirmation-email"
              type="text"
              inputmode="email"
              autocomplete="off"
              aria-describedby="confirmation-error"
            />
            <p id="confirmation-error" class="field-error" role="alert"></p>
            <div class="actions">
              <button id="confirm-delete" class="danger" type="submit">
                Eliminar
              </button>
              <button id="cancel-delete" class="secondary" type="button">
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </section>
      <noscript>Activa JavaScript para usar estas pantallas.</noscript>
    </main>
  </body>
</html>
