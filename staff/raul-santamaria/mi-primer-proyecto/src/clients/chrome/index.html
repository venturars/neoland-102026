<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuarios</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Usuarios</h1>

      <form id="create-form">
        <h2>Crear</h2>
        <label>
          Nombre
          <input id="create-name" name="name" type="text" />
        </label>
        <label>
          Email
          <input id="create-email" name="email" type="text" />
        </label>
        <button type="submit">Crear</button>
      </form>

      <h2>Lista</h2>
      <ul id="user-list"></ul>

      <form id="view-form">
        <h2>Ver</h2>
        <label>
          Id
          <input id="view-id" name="id" type="text" />
        </label>
        <button type="submit">Ver</button>
      </form>
      <p id="viewed-user"></p>

      <form id="update-form">
        <h2>Modificar</h2>
        <label>
          Id
          <input id="update-id" name="id" type="text" />
        </label>
        <label>
          Nombre
          <input id="update-name" name="name" type="text" />
        </label>
        <label>
          Email
          <input id="update-email" name="email" type="text" />
        </label>
        <button type="submit">Modificar</button>
      </form>

      <form id="delete-form">
        <h2>Borrar</h2>
        <label>
          Id
          <input id="delete-id" name="id" type="text" />
        </label>
        <button type="submit">Borrar</button>
      </form>

      <p id="message" class="message"></p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
