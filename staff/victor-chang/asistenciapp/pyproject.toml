# Solo configuración de las herramientas de desarrollo (spec 005 · plan §2.10).
# No convierte el proyecto en un paquete instalable (ARCHITECTURE.md §12).

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # errores y estilo básicos
  "I", "TID",     # imports ordenados y absolutos (S5)
  "N",            # nombres (S1)
  "UP",           # sintaxis moderna (S2)
  "B", "BLE",     # errores habituales; sin `except Exception` mudos (E6)
  "ANN",          # anotaciones de tipo (S2)
  "D",            # docstrings (S3)
  "A",            # no tapar módulos ni nombres de Python (O2)
  "S",            # seguridad (X1, D2)
  "T20",          # sin print fuera del arranque (E7)
  "C90",          # complejidad (M2)
]

# N818 pide el sufijo "Error" en las excepciones; el plan 005 (§2.7) las nombra por lo que pasa
# (SessionClosed, InvalidCode), como ya hace el código.
ignore = ["N818"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# app.py enseña por consola lo que necesita quien arranca la app (E7).
"app.py" = ["T20"]
# Excepción de spec 005 · plan §5: los tests no llevan tipos ni docstring en cada función.
# S101: pytest usa assert. S105/S106: tokens de prueba escritos en el test.
"tests/**" = ["ANN", "D", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app.py", "attendance"]
