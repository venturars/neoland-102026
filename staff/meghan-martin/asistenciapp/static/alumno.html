<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasar lista · AsistenciApp</title>
  <link rel="stylesheet" href="styles.css">
  <script src="alumno.js" defer></script>
</head>
<body>
  <main>
    <p class="muted small">Pasar lista</p>
    <h1 id="title">Cargando…</h1>

    <div id="status" role="status" aria-live="polite"></div>

    <form id="form" class="card" hidden novalidate>
      <label for="name">Tu nombre</label>
      <div class="name-field">
        <input id="name" name="name" type="search" autocomplete="off" placeholder="Escribe tu nombre"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="names">
        <ul id="names" class="name-choices" role="listbox" hidden></ul>
      </div>

      <div class="field-code">
        <label for="code">Código de la pantalla del profesor</label>
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]*"
               maxlength="4" autocomplete="off" required>
      </div>

      <button id="submit" type="submit" class="full">Estoy en clase</button>
    </form>
  </main>
</body>
</html>
