<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>People</title>
    <link rel="stylesheet" href="{{style}}" />
  </head>
  <body>
    <main>
      <section id="list-screen">
        <h1>People</h1>
        <p id="list-error" class="error" role="alert"></p>
        <p id="list-notice" class="notice"></p>
        <form id="create-form">
          <label>
            Name
            <input id="create-name" name="name" type="text" />
          </label>
          <label>
            Email
            <input id="create-email" name="email" type="text" />
          </label>
          <button type="submit">Add</button>
        </form>
        <form id="search-form">
          <label>
            Search
            <input id="search-text" name="text" type="text" />
          </label>
          <button type="submit">Search</button>
          <button id="clear-search" type="button">Show all</button>
        </form>
        <div class="head">
          <span>Id</span>
          <span>Name</span>
          <span>Email</span>
        </div>
        <div id="user-list"></div>
      </section>

      <section id="person-screen" hidden>
        <h1 id="person-name"></h1>
        <p id="person-email" class="muted"></p>
        <p class="muted">Id <span id="person-id"></span></p>
        <p class="muted">Created <span id="person-created"></span></p>
        <p class="muted">Updated <span id="person-updated"></span></p>
        <p id="person-error" class="error" role="alert"></p>
        <form id="update-form">
          <label>
            Name
            <input id="name-input" name="name" type="text" />
          </label>
          <label>
            Email
            <input id="email-input" name="email" type="text" />
          </label>
          <p class="actions">
            <button type="submit">Save</button>
            <button id="cancel-button" type="button">Cancel</button>
          </p>
        </form>
        <form id="delete-form">
          <label>
            Type the saved email to delete
            <input id="confirm-email" name="email" type="text" />
          </label>
          <button class="danger" type="submit">Delete</button>
        </form>
        <button id="back-button" type="button">Back</button>
      </section>
    </main>
    <script nonce="{{nonce}}" src="{{script}}"></script>
  </body>
</html>
