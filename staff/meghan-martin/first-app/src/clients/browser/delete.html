<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Delete</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Delete this person?</h1>
      <p>{{name}}</p>
      <p>{{email}}</p>
      <form method="post" action="/user/delete">
        <input type="hidden" name="id" value="{{id}}" />
        <button type="submit">Delete</button>
      </form>
      <p class="actions">
        <a href="/user/edit?id={{id}}">Cancel</a>
      </p>
    </main>
  </body>
</html>
