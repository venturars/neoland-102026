<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuarios · first-app</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">FIRST-APP / USUARIOS</p>
        <h1>Gestión de usuarios</h1>
      </header>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="list-view" aria-labelledby="list-title">
        <h2 id="list-title" tabindex="-1">Selecciona un usuario</h2>
        <p>
          Elige su ID para continuar. Esta selección no requiere contraseña ni
          autentica al usuario.
        </p>
        <form id="selection-form">
          <label for="user-list">Usuario</label>
          <select id="user-list" required>
            <option value="">Selecciona un ID</option>
          </select>
          <button id="enter" type="submit" disabled>Entrar</button>
        </form>
      </section>
      <section id="menu-view" aria-labelledby="menu-title" hidden>
        <h2 id="menu-title" tabindex="-1">Usuario seleccionado</h2>
        <dl>
          <dt>ID</dt>
          <dd id="menu-id"></dd>
          <dt>Nombre</dt>
          <dd id="menu-name"></dd>
          <dt>Correo</dt>
          <dd id="menu-email"></dd>
        </dl>
        <div class="actions">
          <button id="back-list" type="button">Volver</button
          ><button id="edit" type="button">Modificar usuario</button>
        </div>
      </section>
      <section id="edit-view" aria-labelledby="edit-title" hidden>
        <h2 id="edit-title" tabindex="-1">Modificar usuario</h2>
        <p>ID: <strong id="edit-id"></strong></p>
        <form id="edit-form" novalidate>
          <label for="name">Nombre</label
          ><input id="name" name="name" autocomplete="name" />
          <label for="email">Correo</label
          ><input id="email" name="email" type="email" autocomplete="email" />
          <div class="actions">
            <button type="submit">Guardar</button
            ><button id="delete" type="button" class="danger">
              Eliminar usuario</button
            ><button id="back-menu" type="button">Volver</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
