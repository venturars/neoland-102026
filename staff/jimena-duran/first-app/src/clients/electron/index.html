<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuarios</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Usuarios</h1>
      <p id="error-message" role="alert"></p>
      <section id="users-screen">
        <h2>Crear usuario</h2>
        <form id="create-form" novalidate>
          <label>Nombre <input id="create-name" name="name" /></label>
          <label>Email <input id="create-email" name="email" /></label>
          <button type="submit">Crear</button>
        </form>
        <h2>Ver usuario</h2>
        <form id="find-form" novalidate>
          <label>Id <input id="find-id" name="id" /></label>
          <button type="submit">Ver</button>
        </form>
        <h2>Lista de usuarios</h2>
        <ul id="users-list"></ul>
      </section>
      <section id="user-screen" hidden>
        <h2>Ficha del usuario</h2>
        <dl>
          <dt>Id</dt>
          <dd id="user-id"></dd>
          <dt>Nombre</dt>
          <dd id="user-name"></dd>
          <dt>Email</dt>
          <dd id="user-email"></dd>
          <dt>Creado</dt>
          <dd id="user-created"></dd>
          <dt>Modificado</dt>
          <dd id="user-updated"></dd>
        </dl>
        <form id="update-form" novalidate>
          <label>Nombre <input id="update-name" name="name" /></label>
          <label>Email <input id="update-email" name="email" /></label>
          <button type="submit">Guardar</button>
        </form>
        <div class="actions">
          <button id="delete-user" type="button">Eliminar</button>
          <button id="back-to-list" type="button">Volver</button>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
